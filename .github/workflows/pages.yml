# Deploys the prebuilt static site in this repo to GitHub Pages.
# Pages are generated in a private repo (site/build.py) and pushed here; nothing is built here.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Upload and deploy are separate jobs (GitHub's template). In one job, deploy-pages queried the
  # artifact ~0.3 s after upload and often found none ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
  indexnow:
    # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver...) which pages exist after each deploy.
    # The key is public by design: it must match the file /<key>.txt on this site. No secrets used.
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Submit sitemap URLs
        run: |
          KEY=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          [ -n "$KEY" ] || { echo "no IndexNow key file"; exit 0; }
          python3 - "$KEY" > body.json <<'PY'
          import json, re, sys
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          print(json.dumps({"host": "plainfoldhq.github.io", "key": sys.argv[1],
                            "keyLocation": f"https://plainfoldhq.github.io/{sys.argv[1]}.txt", "urlList": urls[:10000]}))
          PY
          sleep 60  # let Pages serve the new key file first
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @body.json
